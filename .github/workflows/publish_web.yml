name: Deploy all web content to gh-pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/website/**'
      - 'apps/docs/**'
      - 'packages/web-sdk/**'
      - 'packages/vr-engine-schemas/**'
      - 'packages/ui-dom/**'
      - 'packages/auth/**'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all web content
        run: pnpm build:web-all

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/website/dist
          cname: hyperlink.surf
